name: refresh-data
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, fully automatic
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Offline tests (stop if the matching logic is broken)
        run: python tests/test_pipeline.py && python tests/test_end_to_end.py
      - name: Fetch live sources
        run: python pipeline/refresh.py
      - name: Commit data (triggers a Vercel redeploy automatically)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "data: automated refresh"
          # A code push can land while this job runs. Replay the bot's data commit on top of it (bot data wins on conflict), retry on a push race.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts" && exit 1
